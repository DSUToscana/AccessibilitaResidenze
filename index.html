<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestione Residenze - Filtro Città</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.dataTables.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/fixedcolumns/4.3.0/css/fixedColumns.dataTables.min.css">

  <link rel="stylesheet" href="stile.css"> 
   
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/fixedcolumns/4.3.0/js/dataTables.fixedColumns.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.print.min.js"></script>
  
</head>
<body>

  <div class="container">
    <h1>Elenco Residenze</h1>

    <div class="filter-bar">
      <label for="filtro-citta">Filtra per Città:</label>
      <select id="filtro-citta" onchange="applicaFiltro()">
        <option value="tutte">Tutte le città</option>
      </select>

      <button id="btnVistaCompleta" onclick="mostraVistaCompleta()">📊 Lista</button>
      <button id="btnVistaNormale" onclick="ripristinaVistaNormale()" style="display:none;">↩️ Card</button>
    </div>
    
    <div id="lista-residenze" class="residenze-grid">
      <div class="status-msg">Inizializzazione in corso...</div>
    </div>
  </div>

  <script>
    // =========================
    // CONFIG SUPABASE
    // =========================
    const SUPABASE_URL = "https://hrqztgddqmwtljafqahn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_UvgKn-USEKWR-VxnvG_vDA_k55Q15mq";
      
    const clientSupabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Variabile globale per tenere in memoria tutte le residenze scaricate
    let tutteLeResidenze = [];

    // Funzione principale che coordina i caricamenti all'avvio
    async function inizializzaPagina() {
      await caricaMenuCitta();
      await fetchResidenze();
    }

    // 2. FUNZIONE PER POPOLARE IL SELECT DELLE CITTÀ
    async function caricaMenuCitta() {
      try {
        const { data: citta, error } = await clientSupabase
          .from('citta')
          .select('id, citta')
          .order('citta', { ascending: true });

        if (error) throw error;

        const select = document.getElementById('filtro-citta');
        citta.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.id;
          opt.innerText = c.citta;
          select.appendChild(opt);
        });

      } catch (err) {
        console.error("Errore nel caricamento delle città:", err.message);
      }
    }

    // 3. RECUPERO DATI CON RELAZIONE CITTÀ INCLUSA
    async function fetchResidenze() {
      try {
        const { data, error } = await clientSupabase
          .from('residenze')
          .select(`
            id,
            struttura,
            indirizzo,
			cap,
            localita,
            telefono,
            id_citta,
            citta ( citta ),
            scheda_residenze (
              *,
              piani ( * )
            )
          `);

        if (error) {
          document.getElementById('lista-residenze').innerHTML = `<div class="status-msg" style="color: red;">Errore: ${error.message}</div>`;
          return;
        }

        tutteLeResidenze = data;
        renderResidenze(tutteLeResidenze);

      } catch (err) {
        document.getElementById('lista-residenze').innerHTML = `<div class="status-msg" style="color: red;">Errore JS: ${err.message}</div>`;
      }
    }

    // 4. FUNZIONE CHE FILTRA I DATI IN LOCALE
    function applicaFiltro() {
      const idCittaSelezionata = document.getElementById('filtro-citta').value;
      const inVistaTabella = document.getElementById('btnVistaNormale').style.display === 'inline-block';

      // Filtriamo l'array in base alla città
      const datiFiltrati = idCittaSelezionata === "tutte" 
        ? tutteLeResidenze 
        : tutteLeResidenze.filter(r => String(r.id_citta) === String(idCittaSelezionata));

      // Se siamo in vista tabella, aggiorniamo la tabella completa dinamica
      if (inVistaTabella) {
        renderTabellaCompleta(datiFiltrati);
      } else {
        renderResidenze(datiFiltrati);
      }
    }

    // 5. FUNZIONE DI RENDERING DELLE CARD
    function renderResidenze(residenze) {
      const container = document.getElementById('lista-residenze');
      container.innerHTML = ''; 

      if (!residenze || residenze.length === 0) {
        container.innerHTML = '<div class="status-msg">Nessuna residenza trovata per i criteri selezionati.</div>';
        return;
      }

      residenze.forEach(residenza => {
        const scheda = Array.isArray(residenza.scheda_residenze) ? residenza.scheda_residenze[0] : residenza.scheda_residenze;
        const pianos = (scheda && scheda.piani) ? scheda.piani : [];
        const nomeCitta = residenza.citta ? residenza.citta.citta : (residenza.localita || 'N/D');


		const via = encodeURIComponent(residenza.indirizzo.trim());
		const cap = encodeURIComponent(residenza?.cap?.trim() || "");
		const localita = encodeURIComponent(residenza.localita.trim());
		const indirizzoCompleto = via + ','+ cap + ','+ localita;
			// Sostituisce tutti gli spazi con il carattere '+'
		const indirizzoFormattato = indirizzoCompleto.trim().replace(/\s+/g, '+');

        const card = document.createElement('div');
        card.className = 'card';

        let schedaHTML = '';
        if (scheda) {
          const formattaBooleano = (v) => v === true ? 'Sì' : (v === false ? 'No' : v || 'N/D');
          schedaHTML = `
            <div class="scheda-box">
              <h3>Dati Scheda Generale</h3>
              <div class="info-line"><strong>Piani dell'edificio:</strong> ${scheda.piani || 'N/D'}</div>
              <div class="info-line"><strong>Ascensore:</strong> ${formattaBooleano(scheda.ascensore)}</div>
              <div class="info-line"><strong>Rampa:</strong> ${formattaBooleano(scheda.rampa)}</div>
            </div>
          `;
        }

        let pianosHTML = '';
        if (pianos.length > 0) {
          pianos.sort((a, b) => a.piano - b.piano);
          let righeTabella = '';
          pianos.forEach(p => {
            righeTabella += `
              <tr>
                <td><strong>Piano ${p.piano}</strong></td>
                <td>${p.accessibile || 'N/D'}</td>
                <td>${p.num_camere ?? 0}</td>
                <td>${p.num_camere_accessibili ?? 0}</td>
                <td style="font-style:italic; color:#666;">${p.nota || '-'}</td>
              </tr>
            `;
          });

          pianosHTML = `
            <button class="btn-espandi" onclick="togglePiani(this)">+ Vedi Dettaglio Piani (${pianos.length})</button>
            <div class="piani-container">
              <table class="tabella-piani">
                <thead>
                  <tr>
                    <th>Piano</th>
                    <th>Access.</th>
                    <th>Stanze Tot.</th>
                    <th>Stanze Access.</th>
                    <th>Note</th>
                  </tr>
                </thead>
                <tbody>
                  ${righeTabella}
                </tbody>
              </table>
            </div>
          `;
        } else {
          pianosHTML = `<div class="info-line" style="color:#888; font-style:italic; margin-top:15px; text-align:center;">Nessun piano registrato</div>`;
        }


		

        card.innerHTML = `
          <h2 style="margin-top:0;">${residenza.struttura || 'Senza nome'}</h2>
          <div class="info-line"><strong>Indirizzo:</strong> ${residenza.indirizzo || 'N/D'}
			<a id="mapsButton" href="https://www.google.com/maps/search/?api=1&query=${indirizzoFormattato}" target="_blank" style="text-decoration: none; font-size: 1.2em; border: none; background: transparent;">📍</a>
		  </div>
		  <div class="info-line"><strong>Cap:</strong> ${residenza.cap || 'N/D'}</div>
          <div class="info-line"><strong>Città / Località:</strong> ${nomeCitta}
			</div>
		  <div class="info-line"><strong>Tel:</strong> 
			<a href="tel:${residenza.telefono || 'N/D'}" style="color: #0284c7; text-decoration: none;">${residenza.telefono || 'N/D'} 📞 </a>
		  </div>
          ${schedaHTML}
          ${pianosHTML}
        `;

        container.appendChild(card);
      });
    }

    function togglePiani(bottone) {
      const container = bottone.nextElementSibling;
      const eAperto = container.classList.toggle('mostra');
      if (eAperto) {
        bottone.innerText = bottone.innerText.replace('+', '-').replace('Vedi', 'Nascondi');
      } else {
        bottone.innerText = bottone.innerText.replace('-', '+').replace('Nascondi', 'Vedi');
      }
    }

    // questa funzione attiva la super-tabella dinamica con tutti i campi
    function mostraVistaCompleta() {
      document.getElementById('btnVistaCompleta').style.display = 'none';
      document.getElementById('btnVistaNormale').style.display = 'inline-block';
      
      const contenitore = document.getElementById('lista-residenze');
      contenitore.classList.remove('residenze-grid');
      
      // Calcola i dati filtrati attuali e renderizza la mega tabella
      const idCittaSelezionata = document.getElementById('filtro-citta').value;
      const datiDaMostrare = idCittaSelezionata === "tutte" 
        ? tutteLeResidenze 
        : tutteLeResidenze.filter(r => String(r.id_citta) === String(idCittaSelezionata));
        
      renderTabellaCompleta(datiDaMostrare);
    }

    function ripristinaVistaNormale() {
      document.getElementById('btnVistaCompleta').style.display = 'inline-block';
      document.getElementById('btnVistaNormale').style.display = 'none';
      
      const contenitore = document.getElementById('lista-residenze');
      contenitore.classList.add('residenze-grid');
      
      applicaFiltro();
    }

    // FUNZIONI DI APPIATTIMENTO E RENDERING DELLA SUPER TABELLA (Invariate e collegate)
    function appiattisciOggetto(obj, prefisso=''){
      let r={};
      for(const k in obj){
        const v=obj[k];
        const nk=prefisso?`${prefisso}_${k}`:k;
        if(v && typeof v==='object' && !Array.isArray(v)){
           Object.assign(r, appiattisciOggetto(v,nk));
        } else {
           r[nk]=v;
        }
      }
      return r;
    }



function renderTabellaCompleta(residenze){
  const righe=[];

  residenze.forEach(x=>{
    // --- Preparazione indirizzo formattato per Google Maps ---
    const via = encodeURIComponent((x.indirizzo || '').trim());
    const cap = encodeURIComponent((x.cap || '').trim());
    const localita = encodeURIComponent((x.localita || '').trim());
    const indirizzoCompleto = [via, cap, localita].filter(Boolean).join(',');
    const indirizzoFormattato = indirizzoCompleto.replace(/\s+/g, '+');

    // --- Generazione Link HTML ---
    const indirizzoHTML = x.indirizzo ? 
      `${x.indirizzo} <a href="https://www.google.com/maps/search/?api=1&query=${indirizzoFormattato}" target="_blank" rel="noopener noreferrer" style="text-decoration:none; font-size:1.1em;">📍</a>` 
      : '';

    const telefonoHTML = x.telefono ? 
      `<a href="tel:${x.telefono.replace(/\s+/g, '')}" style="color: #0284c7; text-decoration: none;">${x.telefono} 📞</a>` 
      : '';

    const r={
       id: x.id,
       struttura: x.struttura,
       indirizzo: indirizzoHTML, // Inseriamo il codice HTML con il link a Google Maps
       cap: x.cap,
       localita: x.localita,
       telefono: telefonoHTML,   // Inseriamo il codice HTML con il link per chiamare
       citta: x.citta?.citta || ''
    };

    const scheda = Array.isArray(x.scheda_residenze)
       ? x.scheda_residenze[0]
       : x.scheda_residenze;

    if(scheda){
       Object.assign(r, appiattisciOggetto(scheda,'scheda'));
       const piani = scheda.piani || [];
       
       piani.forEach((p,i)=>{
         const campiConsentiti = ['piano', 'accessibile', 'num_camere', 'num_camere_accessibili', 'nota'];
         
         campiConsentiti.forEach(c => {
           if (p[c] !== undefined) {
             r[`piano_${i}_${c}`] = p[c];
           }
         });
       });
    }
    righe.push(r);
  });

  const colonne = [...new Set(righe.flatMap(x=>Object.keys(x)))];

  let html = `<table id="tabellaCompleta" class="display nowrap" style="width:100%"><thead><tr>`;

  colonne.forEach(c => {
    let titolo = c;
    titolo = titolo.replace(/^scheda_/, '');
    titolo = titolo.replace(/^piano_(\d+)_/, (_, piano) => {
      return `Piano ${parseInt(piano) + 1} - `;
    });
    titolo = titolo.replaceAll('_', ' ');
    titolo = titolo
      .split(' ')
      .map(parola => parola.charAt(0).toUpperCase() + parola.slice(1))
      .join(' ');

    html += `<th>${titolo}</th>`;
  });
  html += `</tr></thead><tbody>`;

  righe.forEach(r=>{
     html += '<tr>';
     colonne.forEach(c=>{
        let v = r[c];
        if(v === true) v = 'SI';
        if(v === false) v = 'NO';
        if(v === null || v === undefined) v = '';
        html += `<td>${v}</td>`;
     });
     html += '</tr>';
  });

  html += '</tbody></table>';
  document.getElementById('lista-residenze').innerHTML = html;

  // Inizializzazione DataTables
  $('#tabellaCompleta').DataTable({
    destroy: true,
    scrollX: true,
    scrollCollapse: true,
    fixedColumns: {
      left: 1
    },
    pageLength: 25,
    dom: 'Bfrtip',
    buttons: [
      { extend: 'copy', exportOptions: { columns: ':visible' } },
      { extend: 'csv', exportOptions: { columns: ':visible' } },
      { extend: 'excel', exportOptions: { columns: ':visible' } },
      { extend: 'print', exportOptions: { columns: ':visible' } }
    ],
    columnDefs: [
      {
        targets: [0, 6, 9, 11, 12, 13], 
        visible: false,
        searchable: false
      }
    ],
    language: {
      search: "🔍 Cerca:",
      lengthMenu: "Mostra _MENU_ righe",
      info: "_START_ - _END_ di _TOTAL_",
      paginate: {
        previous: "←",
        next: "→"
      }
    }
  });
}




    // Avvia tutto quanto
    inizializzaPagina();
  </script>
</body>
</html>
