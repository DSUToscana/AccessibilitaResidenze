<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestione Residenze</title>
  
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary-color: #3ecf8e; /* Verde Supabase */
      --dark-color: #1c1c1c;
      --bg-color: #f4f7f6;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 30px;
      background-color: var(--bg-color);
      color: #333;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      color: var(--dark-color);
      border-bottom: 3px solid var(--primary-color);
      padding-bottom: 10px;
      margin-bottom: 30px;
    }

    /* Grid per la lista di residenze */
    .residenze-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 25px;
    }

    /* Stile della singola Card */
    .card {
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      padding: 20px;
      border-top: 4px solid var(--primary-color);
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card h2 {
      margin-top: 0;
      color: var(--dark-color);
      font-size: 1.4em;
    }

    .info-line {
      margin: 8px 0;
      font-size: 0.95em;
    }

    .info-line strong {
      color: #555;
    }

    /* Sezione JOIN (Scheda Residenza) */
    .scheda-box {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px dashed #ddd;
      background-color: #f9f9f9;
      padding: 10px;
      border-radius: 4px;
    }

    .scheda-box h3 {
      margin: 0 0 8px 0;
      font-size: 1em;
      color: #008060;
    }

    .status-msg {
      font-size: 1.2em;
      text-align: center;
      margin-top: 50px;
      color: #666;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Elenco Residenze & Dettagli</h1>
    
    <div id="lista-residenze" class="residenze-grid">
      <div class="status-msg">Connessione a Supabase in corso...</div>
    </div>
  </div>

  <script>
  
      // =========================
    // CONFIG SUPABASE
    // =========================

    const SUPABASE_URL =
      "https://hrqztgddqmwtljafqahn.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_UvgKn-USEKWR-VxnvG_vDA_k55Q15mq";
	  
    const clientSupabase =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );
  
 

    // 2. FUNZIONE DI RECUPERO DATI IN JOIN
    async function fetchResidenze() {
      const { data, error } = await clientSupabase
        .from('residenze')
        .select(`
          id,
          struttura,
          indirizzo,
          localita,
          telefono,
          scheda_residenze (
            *
          )
        `);

      if (error) {
        console.error('Errore nel recupero dati:', error);
        document.getElementById('lista-residenze').innerHTML = `<div class="status-msg" style="color: red;">Errore nel caricamento dei dati dal database.</div>`;
        return;
      }

      renderResidenze(data);
    }

    // 3. FUNZIONE DI MOSTRA DATI
	function renderResidenze(residenze) {
  const container = document.getElementById('lista-residenze');
  container.innerHTML = ''; // Svuota il messaggio di caricamento

  if (!residenze || residenze.length === 0) {
    container.innerHTML = '<div class="status-msg">Nessuna residenza trovata nel database.</div>';
    return;
  }

  residenze.forEach(residenza => {
    // Estraiamo la scheda collegata
    const scheda = Array.isArray(residenza.scheda_residenze) 
      ? residenza.scheda_residenze[0] 
      : residenza.scheda_residenze;

    const card = document.createElement('div');
    card.className = 'card';

    let schedaHTML = '';
    if (scheda) {
      // Funzione di supporto per trasformare eventuali booleani (true/false) in Sì/No
      const formattaBooleano = (valore) => {
        if (valore === true) return 'Sì';
        if (valore === false) return 'No';
        return valore || 'N/D'; // Gestisce anche stringhe o valori nulli
      };

      // Inseriamo i tuoi campi reali: ascensore, rampa, piani
      schedaHTML = `
        <div class="scheda-box">
          <h3>Dati Scheda Collegata</h3>
          <div class="info-line"><strong>Piani:</strong> ${scheda.piani || 'N/D'}</div>
          <div class="info-line"><strong>Ascensore:</strong> ${formattaBooleano(scheda.ascensore)}</div>
          <div class="info-line"><strong>Rampa d'accesso:</strong> ${formattaBooleano(scheda.rampa)}</div>
        </div>
      `;
    } else {
      schedaHTML = `
        <div class="scheda-box" style="background: #fff0f0;">
          <span style="color: #c00; font-size: 0.9em; font-style: italic;">Nessuna scheda associata</span>
        </div>
      `;
    }

    // Costruiamo la card con i dati della residenza + la scheda tecnica appena creata
    card.innerHTML = `
      <h2>${residenza.struttura || 'Struttura senza nome'}</h2>
      <div class="info-line"><strong>ID Residenza:</strong> #${residenza.id}</div>
      <div class="info-line"><strong>Indirizzo:</strong> ${residenza.indirizzo || 'N/D'}</div>
      <div class="info-line"><strong>Località:</strong> ${residenza.localita || 'N/D'}</div>
      <div class="info-line"><strong>Telefono:</strong> ${residenza.telefono || 'N/D'}</div>
      ${schedaHTML}
    `;

    container.appendChild(card);
  });
}

    fetchResidenze();
  </script>
</body>
</html>
