<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <title>Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<h1>Area privata</h1>

<p id="userData"></p>

<button id="logoutBtn">
  Logout
</button>

<script>

    const SUPABASE_URL =
      "https://hrqztgddqmwtljafqahn.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_UvgKn-USEKWR-VxnvG_vDA_k55Q15mq";

  const client =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  async function checkUser(){

    const {
      data: { user }
    } = await client.auth.getUser();


    if(!user){

      // non loggato
      window.location.href = "/";

    }else{

      document
        .getElementById("userData")
        .innerHTML =
          "Utente: " + user.email;

    }

  }

  checkUser();


  // LOGOUT

  document
    .getElementById("logoutBtn")
    .addEventListener("click", async () => {

      await client.auth.signOut();

      window.location.href = "/";

    });

</script>

</body>
</html>
