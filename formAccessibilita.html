    async function loadCities(){

          .select("*")
          .order("citta", {
            ascending: true
          });
		  
		if(error){

        console.error(error);

        select.innerHTML =
          "<option>Errore caricamento</option>";

        return;
      }
		      // svuota select
      select.innerHTML =
        '<option selected value="">-- Seleziona --</option>';


      // aggiunge opzioni
      data.forEach(city => {

        const option =
          document.createElement("option");

        option.value = city.id;

        option.textContent = city.citta;

        select.appendChild(option);

      });

    }
