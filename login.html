<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    body{
      background:#111827;
      color:white;
      font-family:Arial;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .box{
      background:#1f2937;
      padding:30px;
      border-radius:12px;
      width:320px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    input{
      padding:12px;
      border:none;
      border-radius:8px;
    }

    button{
      padding:12px;
      border:none;
      border-radius:8px;
      background:#2563eb;
      color:white;
      cursor:pointer;
      font-weight:bold;
    }

    #message{
      min-height:20px;
    }

  </style>
</head>
<body>

  <div class="box">

    <h1>Login</h1>

    <input
      type="email"
      id="email"
      placeholder="Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button id="loginBtn">
      Accedi
    </button>

    <div id="message"></div>

  </div>
  
  
  

  <script>

    // =========================
    // DATI SUPABASE
    // =========================

    const SUPABASE_URL =
      "https://hrqztgddqmwtljafqahn.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_UvgKn-USEKWR-VxnvG_vDA_k55Q15mq";


    // =========================
    // CLIENT
    // =========================

    const client = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    // =========================
    // LOGIN
    // =========================

    document
      .getElementById("loginBtn")
      .addEventListener("click", async () => {

        const email =
          document.getElementById("email").value;

        const password =
          document.getElementById("password").value;

        const message =
          document.getElementById("message");


        const { data, error } =
          await client.auth.signInWithPassword({

            email: email,
            password: password

          });


        if(error){

          message.innerHTML =
            "Errore: " + error.message;

        }else{

          message.innerHTML =
            "Login effettuato!";

          console.log(data);

          // redirect
          // window.location.href = "dashboard.html";
		  window.location.href = "formAccessibilita.html";
        }

      });

  </script>

</body>
</html>
